services:
  - type: web
    name: fiche-pf2
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: '22'
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
